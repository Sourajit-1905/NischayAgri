[project]
name = "cropml"
version = "0.1.0"
description = "Research code for uncertainty-aware crop disease detection"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.4",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "imagehash>=4.3",
    "pyyaml>=6.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "ruff>=0.7",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]
dvc = [
    "dvc>=3.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cropml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["imagehash.*", "scipy.*", "sklearn.*", "hydra.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]