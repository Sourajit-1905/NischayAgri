services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../apps/api/.env.example
    volumes:
      - ../contracts:/app/contracts:ro

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/v1
    depends_on:
      - api